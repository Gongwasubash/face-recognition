<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Recognition</title>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #0f3460;
        }
        .header h1 { font-size: 1.3rem; color: #00ff88; }
        .status { display: flex; gap: 15px; align-items: center; font-size: 0.85rem; }
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #666; display: inline-block; margin-right: 5px;
        }
        .status-dot.active { background: #00ff88; }
        .main {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 15px;
            padding: 15px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .video-container {
            background: #111; border-radius: 10px;
            overflow: hidden; border: 2px solid #1a1a2e;
            position: relative;
        }
        video, canvas {
            width: 100%; display: block;
        }
        #overlay {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
        }
        .video-overlay {
            position: absolute; top: 10px; left: 10px;
            background: rgba(0,0,0,0.7); padding: 6px 14px;
            border-radius: 16px; font-size: 0.8rem;
            color: #00ff88; border: 1px solid #00ff8833;
            z-index: 10;
        }
        .sidebar { display: flex; flex-direction: column; gap: 12px; }
        .card {
            background: #111; border-radius: 10px;
            padding: 16px; border: 1px solid #1a1a2e;
        }
        .card h3 {
            font-size: 0.8rem; color: #888;
            margin-bottom: 12px; text-transform: uppercase;
            letter-spacing: 1px;
        }
        .face-counter { text-align: center; padding: 5px 0; }
        .face-count {
            font-size: 2.5rem; font-weight: 700;
            color: #00ff88; line-height: 1;
        }
        .face-label { font-size: 0.8rem; color: #666; margin-top: 3px; }
        .names-detected {
            margin-top: 8px; display: flex;
            flex-wrap: wrap; gap: 5px; justify-content: center;
        }
        .name-tag {
            background: #00ff8822; color: #00ff88;
            padding: 3px 10px; border-radius: 10px;
            font-size: 0.75rem; border: 1px solid #00ff8844;
        }
        .name-tag.unknown {
            background: #ff444422; color: #ff4444;
            border-color: #ff444444;
        }
        .controls { display: flex; flex-direction: column; gap: 8px; }
        .btn {
            padding: 10px 16px; border: none; border-radius: 8px;
            cursor: pointer; font-size: 0.85rem; font-weight: 600;
            transition: all 0.2s; display: flex;
            align-items: center; justify-content: center; gap: 6px;
        }
        .btn-primary { background: #00ff88; color: #000; }
        .btn-primary:hover { background: #00cc6a; }
        .btn-train { background: #9b59b6; color: #fff; }
        .btn-train:hover { background: #8e44ad; }
        .btn-danger { background: #ff4444; color: #fff; }
        .btn-danger:hover { background: #cc0000; }
        .input-group { display: flex; gap: 6px; }
        .input-group input {
            flex: 1; padding: 10px 14px; border-radius: 8px;
            border: 1px solid #333; background: #1a1a2e;
            color: #fff; font-size: 0.85rem; outline: none;
        }
        .input-group input:focus { border-color: #00ff88; }
        .people-list { display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow-y: auto; }
        .person-item {
            display: flex; justify-content: space-between;
            align-items: center; padding: 8px;
            background: #1a1a2e; border-radius: 6px;
        }
        .person-info { display: flex; align-items: center; gap: 8px; }
        .person-avatar {
            width: 30px; height: 30px; border-radius: 50%;
            background: #00ff8833; display: flex;
            align-items: center; justify-content: center;
            color: #00ff88; font-weight: bold; font-size: 0.8rem;
        }
        .person-name { font-weight: 600; font-size: 0.85rem; }
        .person-photos { font-size: 0.7rem; color: #666; }
        .btn-sm {
            padding: 4px 10px; font-size: 0.7rem;
            border-radius: 5px; border: none; cursor: pointer;
        }
        .btn-sm-danger { background: #ff4444; color: #fff; }
        .msg { padding: 8px; border-radius: 6px; margin-top: 8px; font-size: 0.8rem; }
        .msg-success { background: #00ff8822; color: #00ff88; }
        .msg-error { background: #ff444422; color: #ff4444; }
        .msg-info { background: #3498db22; color: #3498db; }
        .step-list { margin: 8px 0; padding-left: 18px; }
        .step-list li { margin: 3px 0; font-size: 0.8rem; color: #666; }
        .step-list li.active { color: #00ff88; }
        .section { border-top: 1px solid #1a1a2e; padding-top: 12px; margin-top: 10px; }
        .empty-state { text-align: center; padding: 20px; color: #444; font-size: 0.8rem; }
        .loading { text-align: center; padding: 40px; color: #666; }
        .loading .spinner {
            width: 40px; height: 40px; border: 3px solid #333;
            border-top-color: #00ff88; border-radius: 50%;
            animation: spin 1s linear infinite; margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 768px) { .main { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="header">
        <h1>Face Recognition</h1>
        <div class="status">
            <span><span class="status-dot" id="status-dot"></span><span id="status-text">Loading models...</span></span>
        </div>
    </div>

    <div class="main">
        <div class="video-container">
            <video id="video" autoplay muted playsinline></video>
            <canvas id="overlay"></canvas>
            <div class="video-overlay" id="overlay-text">Loading...</div>
        </div>

        <div class="sidebar">
            <div class="card">
                <h3>Detection</h3>
                <div class="face-counter">
                    <div class="face-count" id="face-count">0</div>
                    <div class="face-label">faces detected</div>
                    <div class="names-detected" id="names-list"></div>
                </div>
            </div>

            <div class="card">
                <h3>Register Person</h3>
                <div class="controls">
                    <div class="input-group">
                        <input type="text" id="person-name" placeholder="Name...">
                        <button class="btn btn-primary" onclick="capturePhoto()" style="width:auto;padding:10px 16px;">
                            Capture
                        </button>
                    </div>
                    <div id="register-msg"></div>
                    <div id="photo-count" style="font-size:0.75rem;color:#666;text-align:center;"></div>
                    <div class="section">
                        <button class="btn btn-train" onclick="trainModel()" style="width:100%;">
                            Train Model
                        </button>
                        <div id="train-msg"></div>
                    </div>
                    <ol class="step-list">
                        <li id="step1" class="active">Enter name</li>
                        <li id="step2">Capture 5+ photos</li>
                        <li id="step3">Click Train Model</li>
                        <li id="step4">Faces show names!</li>
                    </ol>
                </div>
            </div>

            <div class="card">
                <h3>Registered People</h3>
                <div class="people-list" id="people-list">
                    <div class="empty-state">No people registered</div>
                </div>
            </div>

            <div class="card">
                <h3>Actions</h3>
                <div class="controls">
                    <button class="btn btn-primary" onclick="captureScreenshot()" style="width:100%;">
                        Capture Screenshot
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('overlay');
        const ctx = canvas.getContext('2d');
        let modelsLoaded = false;
        let labeledDescriptors = [];
        let faceMatcher = null;
        let registeredPeople = JSON.parse(localStorage.getItem('facePeople') || '{}');
        let photoCount = 0;
        let currentName = '';

        async function loadModels() {
            const MODEL_URL = './models';
            await Promise.all([
                faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL),
                faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL),
            ]);
            modelsLoaded = true;
            document.getElementById('status-dot').classList.add('active');
            document.getElementById('status-text').textContent = 'Models loaded';
            document.getElementById('overlay-text').textContent = 'Starting camera...';
            startCamera();
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480, facingMode: 'user' }
                });
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    document.getElementById('overlay-text').textContent = 'Detecting faces...';
                    detectFaces();
                };
            } catch (err) {
                document.getElementById('overlay-text').textContent = 'Camera access denied';
            }
        }

        async function detectFaces() {
            if (!modelsLoaded) return;

            const detections = await faceapi
                .detectAllFaces(video, new faceapi.TinyFaceDetectorOptions({
                    inputSize: 320,
                    scoreThreshold: 0.5
                }))
                .withFaceLandmarks()
                .withFaceDescriptors();

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let names = [];
            let count = detections.length;

            if (detections.length > 0 && faceMatcher) {
                const results = detections.map(d => faceMatcher.findBestMatch(d.descriptor));

                results.forEach((result, i) => {
                    const det = detections[i];
                    const box = det.detection.box;
                    const name = result.label;
                    const isUnknown = name === 'unknown';

                    names.push(name);

                    ctx.strokeStyle = isUnknown ? '#ff4444' : '#00ff88';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(box.x, box.y, box.width, box.height);

                    ctx.fillStyle = isUnknown ? '#ff4444' : '#00ff88';
                    ctx.font = '16px Segoe UI';
                    ctx.fillText(name, box.x, box.y - 8);

                    if (det.landmarks) {
                        const landmarks = det.landmarks.positions;
                        ctx.fillStyle = isUnknown ? '#ff444488' : '#00ff8888';
                        landmarks.forEach(p => {
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, 1, 0, Math.PI * 2);
                            ctx.fill();
                        });
                    }
                });
            } else {
                detections.forEach(det => {
                    const box = det.detection.box;
                    ctx.strokeStyle = '#ff4444';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(box.x, box.y, box.width, box.height);
                    ctx.fillStyle = '#ff4444';
                    ctx.font = '16px Segoe UI';
                    ctx.fillText('Unknown', box.x, box.y - 8);
                    names.push('Unknown');
                });
            }

            document.getElementById('face-count').textContent = count;
            document.getElementById('overlay-text').textContent =
                count > 0 ? `${count} face(s) detected` : 'No faces detected';

            document.getElementById('names-list').innerHTML = names.map(n => {
                const cls = n === 'unknown' || n === 'Unknown' ? 'name-tag unknown' : 'name-tag';
                return `<span class="${cls}">${n}</span>`;
            }).join('');

            requestAnimationFrame(detectFaces);
        }

        function capturePhoto() {
            const nameInput = document.getElementById('person-name');
            const name = nameInput.value.trim();
            if (!name) { showMsg('register-msg', 'Enter a name!', 'error'); return; }
            currentName = name;

            if (!registeredPeople[name]) {
                registeredPeople[name] = [];
            }

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = video.videoWidth;
            tempCanvas.height = video.videoHeight;
            tempCanvas.getContext('2d').drawImage(video, 0, 0);
            const dataUrl = tempCanvas.toDataURL('image/jpeg', 0.8);

            registeredPeople[name].push(dataUrl);
            localStorage.setItem('facePeople', JSON.stringify(registeredPeople));

            photoCount = registeredPeople[name].length;
            document.getElementById('photo-count').textContent = `${photoCount} photos for ${name}`;
            showMsg('register-msg', `Photo ${photoCount} saved!`, 'success');

            document.getElementById('step2').className = photoCount >= 5 ? 'active' : '';
            document.getElementById('step3').className = photoCount >= 5 ? 'active' : '';

            loadPeople();
        }

        async function trainModel() {
            showMsg('train-msg', 'Training...', 'info');

            labeledDescriptors = [];

            for (const [name, photos] of Object.entries(registeredPeople)) {
                if (photos.length < 2) continue;

                const descriptors = [];
                for (const dataUrl of photos) {
                    const img = await loadImage(dataUrl);
                    const det = await faceapi
                        .detectSingleFace(img, new faceapi.TinyFaceDetectorOptions())
                        .withFaceLandmarks()
                        .withFaceDescriptor();
                    if (det) {
                        descriptors.push(det.descriptor);
                    }
                }

                if (descriptors.length > 0) {
                    labeledDescriptors.push(
                        new faceapi.LabeledFaceDescriptors(name, descriptors)
                    );
                }
            }

            if (labeledDescriptors.length === 0) {
                showMsg('train-msg', 'No faces found in photos. Try again.', 'error');
                return;
            }

            faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.6);

            const totalPeople = labeledDescriptors.length;
            const totalPhotos = labeledDescriptors.reduce((sum, d) => sum + d.descriptors.length, 0);
            showMsg('train-msg', `Trained on ${totalPhotos} photos of ${totalPeople} people!`, 'success');

            document.getElementById('step4').className = 'active';
            photoCount = 0;
            document.getElementById('photo-count').textContent = '';
        }

        function loadImage(src) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.src = src;
            });
        }

        function captureScreenshot() {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = video.videoWidth;
            tempCanvas.height = video.videoHeight;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(video, 0, 0);
            tempCtx.drawImage(canvas, 0, 0, video.videoWidth, video.videoHeight);

            const link = document.createElement('a');
            link.download = `capture_${Date.now()}.jpg`;
            link.href = tempCanvas.toDataURL('image/jpeg', 0.95);
            link.click();
        }

        function deletePerson(name) {
            if (!confirm(`Delete ${name}?`)) return;
            delete registeredPeople[name];
            localStorage.setItem('facePeople', JSON.stringify(registeredPeople));
            labeledDescriptors = labeledDescriptors.filter(d => d.label !== name);
            if (labeledDescriptors.length > 0) {
                faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.6);
            } else {
                faceMatcher = null;
            }
            loadPeople();
        }

        function loadPeople() {
            const list = document.getElementById('people-list');
            const entries = Object.entries(registeredPeople);
            if (entries.length === 0) {
                list.innerHTML = '<div class="empty-state">No people registered</div>';
                return;
            }
            list.innerHTML = entries.map(([name, photos]) => `
                <div class="person-item">
                    <div class="person-info">
                        <div class="person-avatar">${name[0].toUpperCase()}</div>
                        <div>
                            <div class="person-name">${name}</div>
                            <div class="person-photos">${photos.length} photos</div>
                        </div>
                    </div>
                    <button class="btn-sm btn-sm-danger" onclick="deletePerson('${name}')">X</button>
                </div>
            `).join('');
        }

        function showMsg(id, msg, type) {
            document.getElementById(id).innerHTML = `<div class="msg msg-${type}">${msg}</div>`;
            if (type === 'success') setTimeout(() => document.getElementById(id).innerHTML = '', 3000);
        }

        loadModels();
        loadPeople();
    </script>
</body>
</html>
